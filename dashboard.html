<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel de Controle - WhatsApp API</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 0;
    }
    header {
        background: #0a7cff;
        color: white;
        padding: 15px;
        text-align: center;
        font-size: 22px;
    }
    .container {
        width: 90%;
        max-width: 900px;
        margin: 20px auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
    }
    h2 {
        margin-top: 30px;
        color: #333;
    }
    label {
        font-weight: bold;
    }
    input {
        width: 100%;
        padding: 8px;
        margin: 5px 0 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    button {
        padding: 10px 15px;
        border: none;
        background: #0a7cff;
        color: white;
        border-radius: 4px;
        cursor: pointer;
        margin-right: 10px;
    }
    button.red {
        background: #d9534f;
    }
    #qr {
        width: 250px;
        margin-top: 10px;
    }
</style>
</head>
<body>

<header>Painel de Controle - WhatsApp API</header>

<div class="container">

    <h2>Configurações do Sistema</h2>

    <label>Host do Banco</label>
    <input id="db_host">

    <label>Porta</label>
    <input id="db_port">

    <label>Usuário</label>
    <input id="db_user">

    <label>Senha</label>
    <input id="db_pass" type="password">

    <label>Nome do Banco</label>
    <input id="db_name">

    <label>Grupo de Mensagens</label>
    <input id="grupo_mensagens">

    <label>Delay (segundos)</label>
    <input id="delay_segundos" type="number">

    <button onclick="salvarConfig()">Salvar Configurações</button>

    <h2>Status do WhatsApp</h2>
    <p id="status">Carregando...</p>
    <img id="qr">

    <h2>Envio Automático</h2>
    <button onclick="startAuto()">Iniciar</button>
    <button class="red" onclick="stopAuto()">Parar</button>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

socket.on('qr', data => {
    document.getElementById('qr').src = data;
});

socket.on('message', msg => {
    document.getElementById('status').innerText = msg;
});

socket.on('ready', () => {
    document.getElementById('status').innerText = "Conectado";
});

async function carregarConfig() {
    const res = await fetch('/config');
    const cfg = await res.json();

    document.getElementById('db_host').value = cfg.db_host;
    document.getElementById('db_port').value = cfg.db_port;
    document.getElementById('db_user').value = cfg.db_user;
    document.getElementById('db_pass').value = cfg.db_pass;
    document.getElementById('db_name').value = cfg.db_name;
    document.getElementById('grupo_mensagens').value = cfg.grupo_mensagens;
    document.getElementById('delay_segundos').value = cfg.delay_segundos;
}

async function salvarConfig() {
    const cfg = {
        db_host: db_host.value,
        db_port: db_port.value,
        db_user: db_user.value,
        db_pass: db_pass.value,
        db_name: db_name.value,
        grupo_mensagens: grupo_mensagens.value,
        delay_segundos: delay_segundos.value
    };

    await fetch('/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cfg)
    });

    alert("Configurações salvas");
}

async function startAuto() {
    await fetch('/start-auto', { method: 'POST' });
    alert("Envio automático iniciado");
}

async function stopAuto() {
    await fetch('/stop-auto', { method: 'POST' });
    alert("Envio automático parado");
}

carregarConfig();
</script>

</body>
</html>
